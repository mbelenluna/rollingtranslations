<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify your email — Client Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md">
    <div id="loading" class="bg-white rounded-xl shadow-lg p-8 text-center">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-4"></i>
      <p class="text-gray-600">Verifying your email…</p>
    </div>

    <div id="success" class="hidden bg-white rounded-xl shadow-lg p-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-4">
        <i class="fa-solid fa-check-circle text-4xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Email verified!</h1>
      <p class="text-gray-600 mb-6">Your account is now active. You can log in and access the portal.</p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="dashboard.html" class="inline-block px-6 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700">Go to My Projects</a>
        <a href="index.html" class="inline-block px-6 py-2 rounded-lg bg-gray-200 text-gray-800 font-medium hover:bg-gray-300">Log in</a>
      </div>
    </div>

    <div id="error" class="hidden bg-white rounded-xl shadow-lg p-8 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 text-red-600 mb-4">
        <i class="fa-solid fa-times-circle text-4xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Verification failed</h1>
      <p id="error-msg" class="text-gray-600 mb-6">This link is invalid or has expired.</p>
      <p class="text-sm text-gray-500 mb-4">You can request a new verification email from the login page.</p>
      <a href="index.html" class="inline-block px-6 py-2 rounded-lg bg-gray-200 text-gray-800 hover:bg-gray-300 font-medium">Back to login</a>
      <span class="mx-2">or</span>
      <a href="verification-required.html" class="inline-block px-6 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700">Resend verification email</a>
    </div>
  </div>

  <!-- Form auto-submits to API (full-page navigation, no fetch timeout) -->
  <form id="verify-form" method="GET" action="https://us-central1-rolling-crowdsourcing.cloudfunctions.net/verifyEmail" style="display:none">
    <input type="hidden" name="token" id="form-token" value="">
    <input type="hidden" name="redirect" value="1">
  </form>

  <script>
    (function() {
      const loading = document.getElementById('loading');
      const success = document.getElementById('success');
      const error = document.getElementById('error');
      const errorMsg = document.getElementById('error-msg');
      const form = document.getElementById('verify-form');
      const formToken = document.getElementById('form-token');

      const params = new URLSearchParams(location.search);
      const verified = params.get('verified');
      const errParam = params.get('error');
      const message = params.get('message');
      const token = params.get('token');

      // Result from API redirect: ?verified=1 or ?error=1&message=...
      if (verified === '1') {
        loading.classList.add('hidden');
        success.classList.remove('hidden');
        return;
      }
      if (errParam === '1') {
        loading.classList.add('hidden');
        error.classList.remove('hidden');
        errorMsg.textContent = message || 'Verification failed. The link may have expired.';
        return;
      }

      // Has token: submit form to API (full-page GET, then API redirects back)
      if (token && token.length >= 10) {
        formToken.value = token;
        form.submit();
        return;
      }

      // No token
      loading.classList.add('hidden');
      error.classList.remove('hidden');
      errorMsg.textContent = 'No valid verification token was provided.';
    })();
  </script>
</body>
</html>
