<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment successful — Rolling Translations</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
  <div class="max-w-2xl mx-auto px-6 py-16 text-center">
    <h1 class="text-3xl font-extrabold mb-3">Thank you! Payment received. 🎉</h1>
    <p class="text-gray-600 mt-2">Redirecting to your portal…</p>
  </div>
  <script>
  (function(){
    const p = new URLSearchParams(location.search);
    const sessionId = p.get('session_id');
    const requestId = p.get('requestId');
    if (sessionId || requestId) {
      fetch("https://us-central1-rolling-crowdsourcing.cloudfunctions.net/resendConfirmation", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ sessionId, requestId })
      }).catch(()=>{});
    }
    const portalUrl = new URL("../portal/", location.href).href;
    setTimeout(function(){ location.href = portalUrl; }, 3000);
  })();
</script>

</body>
</html>
